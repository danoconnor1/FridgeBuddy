<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fridge Buddy">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    <title>Fridge Buddy</title>
    <script src="lib.js"></script>
    <script>
        (function () {
            var theme = window.FB.normalizeFridgeTheme(localStorage.getItem('fridgeTheme'));
            document.documentElement.setAttribute('data-theme', theme);
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', window.FB.getFridgeThemeColor(theme));
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23378ADD' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>🧊</text></svg>">
