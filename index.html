<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fridge Buddy">
    <meta name="theme-color" content="#ffffff">
    <title>Fridge Buddy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23378ADD' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>🧊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23378ADD' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>🧊</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #999;
            --surface-0: #f5f5f5;
            --surface-1: #ffffff;
            --border: rgba(0,0,0,0.1);
            --border-strong: rgba(0,0,0,0.2);
            --fill-accent: #378ADD;
            --on-accent: #ffffff;
            --fill-success: #639922;
            --text-success: #3B6D11;
            --fill-warning: #BA7517;
            --text-warning: #854F0B;
            --bg-warning: #FAEEDA;
            --border-warning: #EF9F27;
            --fill-danger: #E24B4A;
            --text-danger: #A32D2D;
            --bg-danger: #FCEBEB;
            --border-danger: #F09595;
            --radius: 8px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #e0e0e0;
                --text-secondary: #999;
                --text-muted: #666;
                --surface-0: #1a1a1a;
                --surface-1: #2a2a2a;
                --border: rgba(255,255,255,0.1);
                --border-strong: rgba(255,255,255,0.2);
                --fill-accent: #378ADD;
                --on-accent: #ffffff;
                --fill-success: #639922;
                --text-success: #95C459;
                --fill-warning: #BA7517;
                --text-warning: #EF9F27;
                --bg-warning: #412402;
                --border-warning: #854F0B;
                --fill-danger: #E24B4A;
                --text-danger: #F09595;
                --bg-danger: #501313;
                --border-danger: #A32D2D;
            }
        }
        html, body {
            height: 100%;
            background: var(--surface-0);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
        #root {
            min-height: 100vh;
        }
        input, textarea, button {
            font-family: inherit;
            font-size: inherit;
        }
        input[type="text"], input[type="date"], textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-1);
            color: var(--text-primary);
            width: 100%;
        }
        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            outline: none;
            border-color: var(--fill-accent);
            box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
        }
        button {
            cursor: pointer;
            transition: all 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FridgeBuddy() {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('fridgeItems');
                return saved ? JSON.parse(saved) : [];
            });
            const [recipes, setRecipes] = useState(() => {
                const saved = localStorage.getItem('fridgeRecipes');
                return saved ? JSON.parse(saved) : [];
            });
            const [itemName, setItemName] = useState('');
            const [expiryDate, setExpiryDate] = useState('');
            const [recipeName, setRecipeName] = useState('');
            const [recipeIngredients, setRecipeIngredients] = useState('');
            const [activeTab, setActiveTab] = useState('home');

            const today = new Date().toISOString().split('T')[0];

            useEffect(() => {
                localStorage.setItem('fridgeItems', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('fridgeRecipes', JSON.stringify(recipes));
            }, [recipes]);

            const addItem = () => {
                if (itemName && expiryDate) {
                    setItems([...items, { id: Date.now(), name: itemName, expiry: expiryDate }]);
                    setItemName('');
                    setExpiryDate('');
                }
            };

            const removeItem = (id) => {
                setItems(items.filter(item => item.id !== id));
            };

            const addRecipe = () => {
                if (recipeName && recipeIngredients) {
                    const ingredients = recipeIngredients.split(',').map(i => i.trim().toLowerCase());
                    setRecipes([...recipes, { id: Date.now(), name: recipeName, ingredients }]);
                    setRecipeName('');
                    setRecipeIngredients('');
                }
            };

            const removeRecipe = (id) => {
                setRecipes(recipes.filter(recipe => recipe.id !== id));
            };

            const getDaysUntilExpiry = (expiryDate) => {
                const expiry = new Date(expiryDate);
                const now = new Date();
                const diff = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
                return diff;
            };

            const expiringItems = items.filter(item => {
                const days = getDaysUntilExpiry(item.expiry);
                return days <= 3 && days >= 0;
            }).sort((a, b) => getDaysUntilExpiry(a.expiry) - getDaysUntilExpiry(b.expiry));

            const expiredItems = items.filter(item => getDaysUntilExpiry(item.expiry) < 0);

            const availableItems = items.filter(item => getDaysUntilExpiry(item.expiry) >= 0).map(i => i.name.toLowerCase());

            const suggestedRecipes = recipes.filter(recipe =>
                recipe.ingredients.every(ing => availableItems.some(item => item.includes(ing) || ing.includes(item)))
            );

            return (
                <div style={{ fontFamily: 'inherit', color: 'var(--text-primary)', minHeight: '100vh', background: 'var(--surface-0)', padding: '1rem' }}>
                    <div style={{ maxWidth: '500px', margin: '0 auto' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '2rem', paddingBottom: '1rem', borderBottom: '1px solid var(--border)' }}>
                            <i className="ti ti-fridge" style={{ fontSize: '28px', color: 'var(--fill-accent)' }} aria-hidden="true"></i>
                            <h1 style={{ fontSize: '24px', fontWeight: '500', margin: '0' }}>Fridge Buddy</h1>
                        </div>

                        <div style={{ display: 'flex', gap: '8px', marginBottom: '2rem', borderBottom: '1px solid var(--border)' }}>
                            <button onClick={() => setActiveTab('home')} style={{
                                flex: 1,
                                padding: '12px',
                                border: 'none',
                                background: activeTab === 'home' ? 'var(--surface-1)' : 'transparent',
                                borderBottom: activeTab === 'home' ? '2px solid var(--fill-accent)' : 'none',
                                fontSize: '14px',
                                fontWeight: '500',
                                color: activeTab === 'home' ? 'var(--fill-accent)' : 'var(--text-secondary)'
                            }}>Home</button>
                            <button onClick={() => setActiveTab('fridge')} style={{
                                flex: 1,
                                padding: '12px',
                                border: 'none',
                                background: activeTab === 'fridge' ? 'var(--surface-1)' : 'transparent',
                                borderBottom: activeTab === 'fridge' ? '2px solid var(--fill-accent)' : 'none',
                                fontSize: '14px',
                                fontWeight: '500',
                                color: activeTab === 'fridge' ? 'var(--fill-accent)' : 'var(--text-secondary)'
                            }}>Fridge</button>
                            <button onClick={() => setActiveTab('recipes')} style={{
                                flex: 1,
                                padding: '12px',
                                border: 'none',
                                background: activeTab === 'recipes' ? 'var(--surface-1)' : 'transparent',
                                borderBottom: activeTab === 'recipes' ? '2px solid var(--fill-accent)' : 'none',
                                fontSize: '14px',
                                fontWeight: '500',
                                color: activeTab === 'recipes' ? 'var(--fill-accent)' : 'var(--text-secondary)'
                            }}>Recipes</button>
                        </div>

                        {activeTab === 'home' && (
                            <div>
                                {expiringItems.length > 0 && (
                                    <div style={{ background: 'var(--bg-warning)', border: '1px solid var(--border-warning)', borderRadius: '12px', padding: '1rem', marginBottom: '1.5rem' }}>
                                        <h3 style={{ fontSize: '14px', fontWeight: '500', color: 'var(--text-warning)', margin: '0 0 8px 0' }}>
                                            <i className="ti ti-alert-circle" style={{ verticalAlign: '-2px', marginRight: '6px' }} aria-hidden="true"></i>
                                            Items expiring soon
                                        </h3>
                                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>
                                            {expiringItems.map(item => (
                                                <div key={item.id} style={{ margin: '6px 0' }}>
                                                    <strong>{item.name}</strong> - expires in {getDaysUntilExpiry(item.expiry)} day{getDaysUntilExpiry(item.expiry) !== 1 ? 's' : ''}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {expiredItems.length > 0 && (
                                    <div style={{ background: 'var(--bg-danger)', border: '1px solid var(--border-danger)', borderRadius: '12px', padding: '1rem', marginBottom: '1.5rem' }}>
                                        <h3 style={{ fontSize: '14px', fontWeight: '500', color: 'var(--text-danger)', margin: '0 0 8px 0' }}>
                                            <i className="ti ti-trash" style={{ verticalAlign: '-2px', marginRight: '6px' }} aria-hidden="true"></i>
                                            Expired items
                                        </h3>
                                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>
                                            {expiredItems.map(item => (
                                                <div key={item.id} style={{ margin: '6px 0' }}>
                                                    {item.name} - expired {Math.abs(getDaysUntilExpiry(item.expiry))} day{Math.abs(getDaysUntilExpiry(item.expiry)) !== 1 ? 's' : ''} ago
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {suggestedRecipes.length > 0 && (
                                    <div>
                                        <h2 style={{ fontSize: '18px', fontWeight: '500', margin: '1.5rem 0 1rem 0' }}>
                                            <i className="ti ti-chef-hat" style={{ verticalAlign: '-2px', marginRight: '8px' }} aria-hidden="true"></i>
                                            Recipes you can make
                                        </h2>
                                        {suggestedRecipes.map(recipe => (
                                            <div key={recipe.id} style={{ background: 'var(--surface-1)', border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem', marginBottom: '12px' }}>
                                                <h3 style={{ fontSize: '15px', fontWeight: '500', margin: '0 0 8px 0' }}>
                                                    <i className="ti ti-check-circle" style={{ color: 'var(--fill-success)', verticalAlign: '-2px', marginRight: '6px' }} aria-hidden="true"></i>
                                                    {recipe.name}
                                                </h3>
                                                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: '0' }}>
                                                    {recipe.ingredients.join(', ')}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {suggestedRecipes.length === 0 && items.length > 0 && (
                                    <div style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem 0' }}>
                                        <p>Add some recipes to get suggestions!</p>
                                    </div>
                                )}

                                {items.length === 0 && recipes.length === 0 && (
                                    <div style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem 0' }}>
                                        <p>Start by adding items to your fridge and your favorite recipes.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'fridge' && (
                            <div>
                                <div style={{ background: 'var(--surface-1)', border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem', marginBottom: '1.5rem' }}>
                                    <h3 style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 12px 0' }}>Add item</h3>
                                    <input
                                        type="text"
                                        placeholder="Item name"
                                        value={itemName}
                                        onChange={(e) => setItemName(e.target.value)}
                                        style={{ marginBottom: '12px' }}
                                    />
                                    <input
                                        type="date"
                                        value={expiryDate}
                                        onChange={(e) => setExpiryDate(e.target.value)}
                                        min={today}
                                        style={{ marginBottom: '12px' }}
                                    />
                                    <button
                                        onClick={addItem}
                                        style={{
                                            width: '100%',
                                            padding: '10px',
                                            background: 'var(--fill-accent)',
                                            color: 'var(--on-accent)',
                                            border: 'none',
                                            borderRadius: 'var(--radius)',
                                            fontWeight: '500',
                                            fontSize: '14px'
                                        }}
                                    >
                                        Add item
                                    </button>
                                </div>

                                <h3 style={{ fontSize: '15px', fontWeight: '500', margin: '1.5rem 0 1rem 0' }}>Your items</h3>
                                {items.length === 0 ? (
                                    <p style={{ color: 'var(--text-secondary)', fontSize: '14px' }}>No items yet</p>
                                ) : (
                                    items.map(item => {
                                        const days = getDaysUntilExpiry(item.expiry);
                                        let statusColor = 'var(--fill-success)';
                                        let statusText = days > 3 ? 'Fresh' : days <= 0 ? 'Expired' : 'Expiring soon';
                                        if (days <= 0) statusColor = 'var(--fill-danger)';
                                        else if (days <= 3) statusColor = 'var(--fill-warning)';

                                        return (
                                            <div key={item.id} style={{
                                                background: 'var(--surface-1)',
                                                border: '1px solid var(--border)',
                                                borderRadius: '12px',
                                                padding: '1rem',
                                                marginBottom: '12px',
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'center'
                                            }}>
                                                <div>
                                                    <p style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 4px 0' }}>{item.name}</p>
                                                    <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: '0' }}>
                                                        Expires {new Date(item.expiry).toLocaleDateString()}
                                                    </p>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '4px', marginTop: '6px', fontSize: '12px' }}>
                                                        <i className="ti ti-circle-filled" style={{ fontSize: '8px', color: statusColor }} aria-hidden="true"></i>
                                                        <span style={{ color: statusColor }}>{statusText}</span>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => removeItem(item.id)}
                                                    style={{
                                                        background: 'transparent',
                                                        border: 'none',
                                                        color: 'var(--text-secondary)',
                                                        fontSize: '20px',
                                                        padding: '8px'
                                                    }}
                                                >
                                                    <i className="ti ti-x" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}

                        {activeTab === 'recipes' && (
                            <div>
                                <div style={{ background: 'var(--surface-1)', border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem', marginBottom: '1.5rem' }}>
                                    <h3 style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 12px 0' }}>Add recipe</h3>
                                    <input
                                        type="text"
                                        placeholder="Recipe name"
                                        value={recipeName}
                                        onChange={(e) => setRecipeName(e.target.value)}
                                        style={{ marginBottom: '12px' }}
                                    />
                                    <textarea
                                        placeholder="Ingredients (comma separated)"
                                        value={recipeIngredients}
                                        onChange={(e) => setRecipeIngredients(e.target.value)}
                                        style={{ marginBottom: '12px', minHeight: '80px' }}
                                    />
                                    <button
                                        onClick={addRecipe}
                                        style={{
                                            width: '100%',
                                            padding: '10px',
                                            background: 'var(--fill-accent)',
                                            color: 'var(--on-accent)',
                                            border: 'none',
                                            borderRadius: 'var(--radius)',
                                            fontWeight: '500',
                                            fontSize: '14px'
                                        }}
                                    >
                                        Add recipe
                                    </button>
                                </div>

                                <h3 style={{ fontSize: '15px', fontWeight: '500', margin: '1.5rem 0 1rem 0' }}>Your recipes</h3>
                                {recipes.length === 0 ? (
                                    <p style={{ color: 'var(--text-secondary)', fontSize: '14px' }}>No recipes yet</p>
                                ) : (
                                    recipes.map(recipe => (
                                        <div key={recipe.id} style={{
                                            background: 'var(--surface-1)',
                                            border: '1px solid var(--border)',
                                            borderRadius: '12px',
                                            padding: '1rem',
                                            marginBottom: '12px'
                                        }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                                <div style={{ flex: 1 }}>
                                                    <p style={{ fontSize: '14px', fontWeight: '500', margin: '0 0 8px 0' }}>{recipe.name}</p>
                                                    <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: '0' }}>
                                                        {recipe.ingredients.join(', ')}
                                                    </p>
                                                </div>
                                                <button
                                                    onClick={() => removeRecipe(recipe.id)}
                                                    style={{
                                                        background: 'transparent',
                                                        border: 'none',
                                                        color: 'var(--text-secondary)',
                                                        fontSize: '20px',
                                                        padding: '8px'
                                                    }}
                                                >
                                                    <i className="ti ti-x" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<FridgeBuddy />);
    </script>
</body>
</html>
