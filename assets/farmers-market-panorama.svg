    <pattern id="stripe" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f5e6a8"/>
      <rect width="8" height="16" fill="#fff8e8"/>
    </pattern>
    <pattern id="wood" width="40" height="8" patternUnits="userSpaceOnUse">
      <rect width="40" height="8" fill="#8b5a3c"/>
      <rect width="40" height="2" y="6" fill="#6b4423" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

