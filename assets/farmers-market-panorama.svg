    <pattern id="brick" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#c9a882"/>
      <rect width="17" height="8" x="1" y="1" fill="#b89272" rx="1"/>
      <rect width="17" height="8" x="19" y="10" fill="#b89272" rx="1"/>
